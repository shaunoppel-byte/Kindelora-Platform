<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-labelledby="title desc"><title id="title">Quiet Courage — KINDELORA</title><desc id="desc">Original illustrated affirmation artwork featuring mountain scenery and the affirmation I can take a brave step without needing to feel fearless.</desc><defs><linearGradient id="sky" x2=".2" y2="1"><stop stop-color="#172945"/><stop offset=".55" stop-color="#b87375"/><stop offset="1" stop-color="#f5c88a"/></linearGradient><radialGradient id="sun"><stop stop-color="#fff4d8" stop-opacity=".95"/><stop offset="1" stop-color="#ffe1a3" stop-opacity="0"/></radialGradient></defs><rect width="1080" height="1350" fill="url(#sky)"/><circle cx="790" cy="740" r="340" fill="url(#sun)"/><path d="M0 800 200 580 340 710 575 360 840 700 1030 520 1080 600V1350H0Z" fill="#263c5b"/><path d="m470 485 105-125 110 150-104-47-45 55Z" fill="#f9e9d6"/><rect x="65" y="65" width="950" height="1220" rx="20" fill="none" stroke="#f3d08b" stroke-width="4"/><rect x="80" y="80" width="920" height="1190" rx="12" fill="none" stroke="#f3d08b" stroke-opacity=".5"/><rect x="108" y="175" width="864" height="510" rx="30" fill="#160b2b" fill-opacity=".65"/><text x="540" y="250" text-anchor="middle" font-family="Georgia,serif" font-size="34" letter-spacing="10" fill="#f4d49b">KINDELORA</text><path d="M480 280Q540 230 600 280Q540 315 480 280Z" fill="none" stroke="#f4d49b" stroke-width="4"/><text x="540" y="483" text-anchor="middle" font-family="Georgia,serif" font-size="45" font-style="italic" fill="#fff7e9">I can take a brave step without</text><text x="540" y="547" text-anchor="middle" font-family="Georgia,serif" font-size="45" font-style="italic" fill="#fff7e9">needing to feel fearless.</text><text x="540" y="620" text-anchor="middle" font-family="Georgia,serif" font-size="31" fill="#f4d49b">Quiet Courage</text><text x="540" y="1220" text-anchor="middle" font-family="Georgia,serif" font-size="27" fill="#fff0dc">Small moments. Brighter days.</text></svg>