<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-labelledby="title desc"><title id="title">Patience — KINDELORA</title><desc id="desc">Original illustrated affirmation artwork featuring lake scenery and the affirmation I can honour slow progress while still caring about where I am going.</desc><defs><linearGradient id="sky" x2=".2" y2="1"><stop stop-color="#193c58"/><stop offset=".55" stop-color="#a57e8c"/><stop offset="1" stop-color="#f9d6a4"/></linearGradient><radialGradient id="sun"><stop stop-color="#fff4d8" stop-opacity=".95"/><stop offset="1" stop-color="#ffe1a3" stop-opacity="0"/></radialGradient></defs><rect width="1080" height="1350" fill="url(#sky)"/><circle cx="790" cy="740" r="340" fill="url(#sun)"/><path d="M0 870Q270 830 540 880T1080 850V1350H0Z" fill="#2f6277"/><path d="M0 950Q270 930 540 965T1080 940M0 1080Q270 1060 540 1090T1080 1070" stroke="#e7c8a7" stroke-width="7" fill="none" opacity=".5"/><rect x="65" y="65" width="950" height="1220" rx="20" fill="none" stroke="#f3d08b" stroke-width="4"/><rect x="80" y="80" width="920" height="1190" rx="12" fill="none" stroke="#f3d08b" stroke-opacity=".5"/><rect x="108" y="175" width="864" height="510" rx="30" fill="#160b2b" fill-opacity=".65"/><text x="540" y="250" text-anchor="middle" font-family="Georgia,serif" font-size="34" letter-spacing="10" fill="#f4d49b">KINDELORA</text><path d="M480 280Q540 230 600 280Q540 315 480 280Z" fill="none" stroke="#f4d49b" stroke-width="4"/><text x="540" y="451" text-anchor="middle" font-family="Georgia,serif" font-size="45" font-style="italic" fill="#fff7e9">I can honour slow progress while</text><text x="540" y="515" text-anchor="middle" font-family="Georgia,serif" font-size="45" font-style="italic" fill="#fff7e9">still caring about where I am</text><text x="540" y="579" text-anchor="middle" font-family="Georgia,serif" font-size="45" font-style="italic" fill="#fff7e9">going.</text><text x="540" y="620" text-anchor="middle" font-family="Georgia,serif" font-size="31" fill="#f4d49b">Patience</text><text x="540" y="1220" text-anchor="middle" font-family="Georgia,serif" font-size="27" fill="#fff0dc">Small moments. Brighter days.</text></svg>