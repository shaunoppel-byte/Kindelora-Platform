<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-labelledby="title desc"><title id="title">Belonging — KINDELORA</title><desc id="desc">Original illustrated affirmation artwork featuring tree scenery and the affirmation I do not need to become someone else to deserve a place.</desc><defs><linearGradient id="sky" x2=".2" y2="1"><stop stop-color="#203c46"/><stop offset=".55" stop-color="#9a8b62"/><stop offset="1" stop-color="#f0c98d"/></linearGradient><radialGradient id="sun"><stop stop-color="#fff4d8" stop-opacity=".95"/><stop offset="1" stop-color="#ffe1a3" stop-opacity="0"/></radialGradient></defs><rect width="1080" height="1350" fill="url(#sky)"/><circle cx="270" cy="740" r="340" fill="url(#sun)"/><path d="M780 1150 820 650" stroke="#392f3b" stroke-width="60"/><circle cx="800" cy="580" r="240" fill="#597a63"/><circle cx="670" cy="610" r="160" fill="#78996d"/><circle cx="900" cy="530" r="170" fill="#a4ad7b"/><rect x="65" y="65" width="950" height="1220" rx="20" fill="none" stroke="#f3d08b" stroke-width="4"/><rect x="80" y="80" width="920" height="1190" rx="12" fill="none" stroke="#f3d08b" stroke-opacity=".5"/><rect x="108" y="175" width="864" height="510" rx="30" fill="#160b2b" fill-opacity=".65"/><text x="540" y="250" text-anchor="middle" font-family="Georgia,serif" font-size="34" letter-spacing="10" fill="#f4d49b">KINDELORA</text><path d="M480 280Q540 230 600 280Q540 315 480 280Z" fill="none" stroke="#f4d49b" stroke-width="4"/><text x="540" y="483" text-anchor="middle" font-family="Georgia,serif" font-size="45" font-style="italic" fill="#fff7e9">I do not need to become someone</text><text x="540" y="547" text-anchor="middle" font-family="Georgia,serif" font-size="45" font-style="italic" fill="#fff7e9">else to deserve a place.</text><text x="540" y="620" text-anchor="middle" font-family="Georgia,serif" font-size="31" fill="#f4d49b">Belonging</text><text x="540" y="1220" text-anchor="middle" font-family="Georgia,serif" font-size="27" fill="#fff0dc">Small moments. Brighter days.</text></svg>