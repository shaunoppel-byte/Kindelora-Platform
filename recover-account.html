<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><meta name="referrer" content="no-referrer"><title>Secure Account Recovery | KINDELORA</title><style>body{margin:0;min-height:100vh;background:#12121c;color:#f9f6ee;font:16px/1.6 system-ui,Arial,sans-serif;display:grid;place-items:center;padding:20px;box-sizing:border-box}main{width:min(100%,430px);background:#20202d;border:1px solid #5b4a38;border-radius:20px;padding:32px;box-sizing:border-box}h1{font-size:1.65rem;margin:0 0 8px;color:#e9c88d}p{color:#d7d3cb}label{display:block;margin-top:18px}input{box-sizing:border-box;width:100%;padding:13px;margin-top:7px;border:1px solid #85745d;border-radius:8px;background:#101018;color:white;font:inherit}button{margin-top:24px;width:100%;padding:14px;border:0;border-radius:9px;background:#e9c88d;color:#1b1711;font-weight:700;font:inherit;cursor:pointer}button:disabled{opacity:.6;cursor:wait}a{color:#e9c88d}#status{min-height:25px}small{color:#c7c0b6}</style></head>
<body><main><h1>KINDELORA</h1><h2 id="heading">Reset your password</h2><p id="intro">Enter your account email and we will send a secure recovery link if your account is eligible.</p>
<form id="request-form"><label for="email">Email address</label><input id="email" type="email" autocomplete="email" maxlength="254" required><button type="submit">Send recovery link</button></form>
<form id="confirm-form" hidden><label for="password">New password</label><input id="password" type="password" autocomplete="new-password" minlength="12" maxlength="256" required><label for="confirm-password">Confirm new password</label><input id="confirm-password" type="password" autocomplete="new-password" minlength="12" maxlength="256" required><small>Use at least 12 characters.</small><button type="submit">Set new password</button></form>
<p id="status" role="status" aria-live="polite"></p><p><a href="/plus-account.html">Return to secure sign-in</a></p></main>
<script type="module">
const requestForm=document.getElementById('request-form'),confirmForm=document.getElementById('confirm-form'),status=document.getElementById('status');
// Remove token from URL immediately to avoid referrer, history and analytics exposure.
const params=new URLSearchParams(location.hash.slice(1)),token=params.get('reset');if(location.hash||location.search)history.replaceState(null,'',location.pathname);
const validToken=typeof token==='string'&&/^[a-f0-9]{64}$/.test(token);
if(validToken){requestForm.hidden=true;confirmForm.hidden=false;document.getElementById('heading').textContent='Choose a new password';document.getElementById('intro').textContent='Your recovery link is valid for up to 15 minutes and can be used once.'}
else if(token){status.textContent='This recovery link is invalid. Request a new one below.'}
async function post(path,data){const response=await fetch(path,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(data),cache:'no-store',credentials:'same-origin',referrerPolicy:'no-referrer'});let result={};try{result=await response.json()}catch{}return {ok:response.ok,result}}
requestForm.addEventListener('submit',async event=>{event.preventDefault();const button=requestForm.querySelector('button');button.disabled=true;status.textContent='Sending request…';try{const response=await post('/api/member/request-password-reset',{email:document.getElementById('email').value});status.textContent=response.ok?'If an eligible account exists, check your email for the next step.':'Account recovery is temporarily unavailable. Please try again later.'}catch{status.textContent='Connection unavailable. Please try again.'}finally{button.disabled=false}});
confirmForm.addEventListener('submit',async event=>{event.preventDefault();const password=document.getElementById('password').value;if(password!==document.getElementById('confirm-password').value){status.textContent='Passwords do not match.';return}const button=confirmForm.querySelector('button');button.disabled=true;status.textContent='Updating password…';try{const response=await post('/api/member/confirm-password-reset',{token,password});document.getElementById('password').value='';document.getElementById('confirm-password').value='';if(response.ok&&response.result.reset){confirmForm.hidden=true;status.textContent='Password updated. Return to secure sign-in.'}else{status.textContent='Recovery failed or link expired. Please request a new link.'}}catch{status.textContent='Connection unavailable. Please try again.'}finally{button.disabled=false}});
</script></body></html>
