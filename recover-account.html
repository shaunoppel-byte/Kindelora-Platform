<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><meta name="referrer" content="no-referrer"><title>Secure Account Recovery | KINDELORA</title><style>body{margin:0;min-height:100vh;background:#12121c;color:#f9f6ee;font:16px/1.6 system-ui,Arial,sans-serif;display:grid;place-items:center;padding:20px;box-sizing:border-box}main{width:min(100%,430px);background:#20202d;border:1px solid #5b4a38;border-radius:20px;padding:32px;box-sizing:border-box}h1{font-size:1.65rem;margin:0 0 8px;color:#e9c88d}p{color:#d7d3cb}label{display:block;margin-top:18px}input{box-sizing:border-box;width:100%;padding:13px;margin-top:7px;border:1px solid #85745d;border-radius:8px;background:#101018;color:white;font:inherit}button{margin-top:24px;width:100%;padding:14px;border:0;border-radius:9px;background:#e9c88d;color:#1b1711;font-weight:700;font:inherit;cursor:pointer}button:disabled{opacity:.6;cursor:wait}a{color:#e9c88d}#status{min-height:25px}small{color:#c7c0b6}</style></head>
<body><main><h1>KINDELORA</h1><h2 id="heading">Reset your password</h2><p id="intro">Enter your account email and we will send a secure recovery link if your account is eligible.</p>
<form id="request-form"><label for="email">Email address</label><input id="email" type="email" autocomplete="email" maxlength="254" required><button type="submit">Send recovery link</button></form>
<form id="confirm-form" hidden><label for="password">New password</label><input id="password" type="password" autocomplete="new-password" minlength="12" maxlength="256" required><label for="confirm-password">Confirm new password</label><input id="confirm-password" type="password" autocomplete="new-password" minlength="12" maxlength="256" required><small>Use at least 12 characters.</small><button type="submit">Set new password</button></form>
<p id="status" role="status" aria-live="polite"></p><p><a href="/plus-account.html">Return to secure sign-in</a></p></main>
<script type="module" src="/recover-account.js"></script></body></html>
