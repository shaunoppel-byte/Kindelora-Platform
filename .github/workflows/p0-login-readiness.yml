name: P0 login readiness contract
on:
  pull_request:
  push:
    branches: [main]
jobs:
  login-readiness:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify login readiness configuration schema and crypto stages
        run: node scripts/test-p0-login-readiness.mjs
