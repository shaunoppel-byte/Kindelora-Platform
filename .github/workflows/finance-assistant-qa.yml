name: Finance assistant contract QA
on:
  push:
    paths:
      - 'lib/finance/assistant-queries.mjs'
      - 'scripts/test-finance-assistant.mjs'
      - '.github/workflows/finance-assistant-qa.yml'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  assistant:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/test-finance-assistant.mjs
