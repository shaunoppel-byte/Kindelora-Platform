name: P0 member login handler integration
on:
  pull_request:
  push:
    branches: [main]
jobs:
  member-login:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Execute real member login handler with synthetic account and mocked D1
        run: node scripts/test-p0-member-login-handler-integration.mjs
