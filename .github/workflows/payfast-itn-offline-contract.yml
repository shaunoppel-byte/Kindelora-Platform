name: PayFast offline ITN state contract
on:
  pull_request:
    paths:
      - 'functions/_lib/payfast-itn-state.mjs'
      - 'scripts/test-payfast-itn-state.mjs'
      - '.github/workflows/payfast-itn-offline-contract.yml'
  workflow_dispatch:
jobs:
  itn-state:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test scripts/test-payfast-itn-state.mjs
