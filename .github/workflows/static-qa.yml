name: KINDELORA static-site QA
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check required site assets
        run: |
          test -f index.html
          test -f app.js
          test -f manifest.webmanifest
          test -f sw.js
          test -f _headers
      - name: Validate JavaScript syntax
        run: |
          node --check app.js
          node --check sw.js
          node --check member-favourites.js
      - name: Run full Node functional and regression test suite
        run: node --test tests/*.test.cjs
      - name: Validate all first-party browser scripts
        run: |
          for file in app.js sw.js member-favourites.js emotional-check-in.js affirmation-preview.js affirmation-card-actions.js; do node --check "$file"; done
      - name: Validate local HTML fragment links
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          class Links(HTMLParser):
              def __init__(self):
                  super().__init__(); self.ids=set(); self.links=[]
              def handle_starttag(self, tag, attrs):
                  d=dict(attrs)
                  if d.get('id'): self.ids.add(d['id'])
                  if tag=='a' and d.get('href','').startswith('#'):
                      self.links.append(d['href'][1:])
          p=Links();p.feed(Path('index.html').read_text())
          missing=[x for x in p.links if x and x not in p.ids]
          if missing: raise SystemExit('Missing anchors: '+', '.join(missing))
          print(f'Validated {len(p.links)} fragment links')
          PY

      - name: Verify heart icon and subscription gate consistency
        run: python3 scripts/check-heart-consistency.py
      - name: Check interactive DOM targets
        run: python3 scripts/check-launch-dom.py
      - name: Check member access fail-closed security invariants
        run: |
          for file in functions/api/member/*.js; do node --check "$file"; done
          python3 scripts/check-member-access.py
          node scripts/member-smoke.mjs
          node scripts/member-isolation-smoke.mjs
          node scripts/member-entitlement-isolation-smoke.mjs
      - name: Verify Pages Functions local imports resolve
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          for file in Path('functions').rglob('*.js'):
              source = file.read_text()
              for target in re.findall(r'''(?:from\s*|import\s*\()\s*["'](\.[^"']+)["']''', source):
                  resolved = (file.parent / target).resolve()
                  if not resolved.is_file():
                      raise SystemExit(f'Unresolved import in {file}: {target}')
          print('All local Pages Functions imports resolve')
          PY
      - name: Validate curated message library
        run: python3 scripts/check-message-library.py

      - name: Preflight 5000-message expansion when submitted
        run: python3 scripts/check-5000-release.py

      - name: Run editorial similarity audit
        run: python3 scripts/audit-message-library.py
