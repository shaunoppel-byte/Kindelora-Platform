name: PayFast D1 schema readiness
on:
  pull_request:
  push:
    branches: [main]
jobs:
  readiness:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/test-payfast-d1-schema-readiness.mjs
