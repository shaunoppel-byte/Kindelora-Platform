name: PayFast sandbox settlement quote contract
on:
  pull_request:
    paths:
      - 'functions/_lib/payfast-sandbox-quote.js'
      - 'scripts/test-payfast-sandbox-quote.mjs'
      - '.github/workflows/payfast-sandbox-quote.yml'
  push:
    branches: [main]
    paths:
      - 'functions/_lib/payfast-sandbox-quote.js'
      - 'scripts/test-payfast-sandbox-quote.mjs'
      - '.github/workflows/payfast-sandbox-quote.yml'
jobs:
  quote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test scripts/test-payfast-sandbox-quote.mjs
