name: PayFast isolated D1 renewal transaction test

on:
  push:
    branches: [main]
    paths:
      - 'staging/payfast-d1-worker-atomicity.js'
      - 'staging/migrations/20261123_issue806_payment_reconciliations.sql'
      - 'staging/payfast-d1-initial-recurring-atomicity.js'
      - 'functions/_lib/payfast-initial-recurring-isolated-staging-executor.js'
      - 'functions/_lib/payfast-live-recurring-link-atomic-batch.js'
      - 'functions/_lib/payfast-live-recurring-link-atomic-plan.js'
      - 'staging/payfast-d1-worker-test-entry.js'
      - 'functions/_lib/payfast-live-renewal-atomic-design.js'
      - 'functions/_lib/payfast-renewal-isolated-staging-executor.js'
      - 'scripts/prepare-payfast-d1-private-test.py'
      - '.github/workflows/payfast-d1-private-transaction-test.yml'
  workflow_dispatch:
    inputs:
      confirm_staging_only:
        description: 'Type STAGING_ONLY to test synthetic transactions in isolated staging D1'
        required: true
        type: string

permissions:
  contents: read
  issues: write

concurrency:
  group: payfast-issue806-staging-d1-transaction-test
  cancel-in-progress: false

jobs:
  staging-transaction-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: payfast-d1-staging
    env:
      CONFIRM_STAGING_ONLY: ${{ github.event_name == 'push' && 'STAGING_ONLY' || inputs.confirm_staging_only }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.KINDELORA_D1_STAGING_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.KINDELORA_D1_STAGING_ACCOUNT_ID }}
      STAGING_DATABASE_ID: ${{ vars.KINDELORA_D1_STAGING_DATABASE_ID }}
      PRODUCTION_DATABASE_ID: ${{ vars.KINDELORA_D1_PRODUCTION_DATABASE_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify isolated staging database
        id: verify_staging
        run: python3 scripts/prepare-payfast-d1-private-test.py
      - name: Apply missing reconciliation schema to verified staging D1 only
        run: |
          set -euo pipefail
          # Previous step verified staging UUID and name against Cloudflare API.
          # This command is explicitly remote, uses the isolated staging config,
          # and is restricted to the staging database name.
          npx --yes wrangler@4 d1 execute kindelora-payfast-d1-staging --remote \\
            --config .staging-worker/wrangler-test.toml \\
            --file staging/migrations/20261123_issue806_payment_reconciliations.sql
      - name: Run staging-only D1 batch test in remote preview
        id: remote_d1_test
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4 dev --remote --config .staging-worker/wrangler-test.toml --ip 127.0.0.1 --port 8799 > /tmp/issue806-wrangler.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          ready=0
          for i in $(seq 1 45); do
            if [ "$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8799/ || true)" = "404" ]; then ready=1; break; fi
            sleep 2
          done
          if [ "$ready" != 1 ]; then
            echo "Remote preview did not become ready; inspect safe diagnostic tail"
            tail -n 30 /tmp/issue806-wrangler.log
            exit 1
          fi
          # Preserve the staging-only JSON error response even when the Worker
          # returns HTTP 500; otherwise curl -f hides the root cause.
          http_status="$(curl -sS -X POST http://127.0.0.1:8799/__issue806_test -o /tmp/issue806-result.json -w '%{http_code}')"
          echo "Staging D1 test endpoint HTTP status: $http_status"
          if [ "$http_status" != "200" ]; then
            python3 - <<'PYERR'
          import json
          from pathlib import Path
          raw=Path('/tmp/issue806-result.json').read_text()[:2000]
          try:
           body=json.loads(raw)
           print('Staging-only error:',json.dumps({'status':body.get('status'),'reason':str(body.get('reason',''))[:240]}))
          except Exception:
           print('Staging-only response was not JSON; no response body published')
          PYERR
            echo 'Remote Worker diagnostic tail (review for secrets before sharing):'
            tail -n 15 /tmp/issue806-wrangler.log | sed -E 's/(Bearer |token[=: ]+)[A-Za-z0-9._-]+/\\1[REDACTED]/Ig'
            exit 1
          fi
          python3 - <<'PY'
          import json
          result=json.load(open('/tmp/issue806-result.json'))
          print(json.dumps(result))
          required={
            'isolated fixture',
            'executor staging gate denies without D1 mutation',
            'concurrent duplicate: one commit one rejection',
            'single atomic commit',
            'replay rejected',
            'replay no state change',
            'wrong recurring token rollback',
            'four additional D1 rollback cases',
            'second billing cycle extends next month once',
            'second cycle replay rejected',
            'initial recurring staging gate no mutation',
            'initial recurring five-statement atomic commit',
            'initial recurring replay rollback'
          }
          if result.get('status')!='PASS':raise SystemExit('D1 staging transaction test failed')
          if result.get('productionCharging') is not False:raise SystemExit('Production charging isolation not proven')
          if result.get('fixturePrefix')!='stg806_':raise SystemExit('Unexpected fixture scope')
          missing=required-set(result.get('tests',[]))
          if missing:raise SystemExit('Missing staging assertions: '+', '.join(sorted(missing)))
          PY

      - name: Publish isolated D1 test outcome to Issue 806
        if: always()
        uses: actions/github-script@v7
        env:
          D1_STAGING_IDENTITY: ${{ steps.verify_staging.outcome }}
          D1_TRANSACTION_OUTCOME: ${{ steps.remote_d1_test.outcome }}
          D1_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const identity = process.env.D1_STAGING_IDENTITY;
            const transaction = process.env.D1_TRANSACTION_OUTCOME;
            const url = process.env.D1_RUN_URL;
            const outcome = identity === 'success' && transaction === 'success' ? 'PASS' : 'NOT PASS';
            const body = [
              'Issue #806 isolated Cloudflare D1 staging workflow: **' + outcome + '**',
              'Run: ' + url,
              'Staging identity verification: ' + identity,
              'Remote D1 transaction assertions: ' + transaction,
              'PASS means the workflow asserted isolated D1 identity, renewal concurrency, replay, rollback, two billing cycles, and initial recurring-link atomicity.',
              'This is synthetic staging evidence only. Provider-authenticated live PayFast E2E and production charging remain NOT VERIFIED / NO-GO.',
              'No production D1 or registration changes are authorized by this workflow.'
            ].join('\\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 806,
              body
            });
      - name: Record explicit test boundary
        if: always()
        run: |
          echo '## Issue #806 — isolated D1 staging batch test' >> "$GITHUB_STEP_SUMMARY"
          echo '- See step logs for actual PASS/FAIL; never infer pass from deployment' >> "$GITHUB_STEP_SUMMARY"
          echo '- On successful job completion: concurrency, replay and five fixture-scoped rollback cases verified in isolated staging D1' >> "$GITHUB_STEP_SUMMARY"
          echo '- Provider authentication, remaining rollback cases and live PayFast end-to-end: NOT VERIFIED' >> "$GITHUB_STEP_SUMMARY"
          echo '- Production registration and live charging: unchanged' >> "$GITHUB_STEP_SUMMARY"
