name: Zero-cost configuration guard
on:
  pull_request:
  push:
    branches: [main]
jobs:
  zero-cost-guard:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Scan configuration for potential paid dependencies
        run: python3 scripts/check-zero-cost.py
