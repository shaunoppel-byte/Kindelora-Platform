name: Finance reporting QA
on:
  push:
    paths:
      - 'lib/finance/reporting.mjs'
      - 'scripts/test-finance-reporting.mjs'
      - '.github/workflows/finance-reporting-qa.yml'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  report-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/test-finance-reporting.mjs
