name: PayFast sandbox persisted order loader
on:
  pull_request:
  push:
    branches: [main]
jobs:
  persisted-order:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/test-payfast-sandbox-persisted-order.mjs
