name: Premium static exposure regression
on:
  push:
    paths:
      - 'motivational-monday.html'
      - 'index.html'
      - 'app.js'
      - 'message-catalogue.json'
      - 'sw.js'
      - 'functions/**'
      - 'assets/audio/**'
      - 'scripts/check-premium-static-exposure.mjs'
      - '.github/workflows/premium-static-security.yml'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  premium-static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: node scripts/check-premium-static-exposure.mjs
