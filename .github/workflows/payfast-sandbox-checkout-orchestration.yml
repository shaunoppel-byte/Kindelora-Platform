name: PayFast sandbox checkout orchestration
on:
  pull_request:
  push:
    branches: [main]
jobs:
  sandbox-checkout:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --experimental-default-type=module scripts/test-payfast-sandbox-checkout-orchestration.mjs
