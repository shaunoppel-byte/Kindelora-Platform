name: PayFast offline signature contract
on:
  pull_request:
    paths:
      - 'functions/_lib/payfast-canonicalization.mjs'
      - 'scripts/test-payfast-canonicalization.mjs'
      - '.github/workflows/payfast-offline-contract.yml'
  workflow_dispatch:
jobs:
  offline-signature:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test scripts/test-payfast-canonicalization.mjs
