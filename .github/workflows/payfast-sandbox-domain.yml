name: PayFast offline subscription state contracts
on:
  pull_request:
    paths:
      - 'functions/_lib/payfast-sandbox-domain.js'
      - 'scripts/test-payfast-sandbox-domain.mjs'
      - '.github/workflows/payfast-sandbox-domain.yml'
  push:
    branches: [main]
jobs:
  offline-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test scripts/test-payfast-sandbox-domain.mjs
