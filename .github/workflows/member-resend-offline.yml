name: Member Resend offline contract
on:
  pull_request:
    paths:
      - 'functions/_lib/member-verification-delivery.js'
      - 'scripts/test-member-resend-acknowledgement.mjs'
      - '.github/workflows/member-resend-offline.yml'
  workflow_dispatch:
jobs:
  resend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test scripts/test-member-resend-acknowledgement.mjs
