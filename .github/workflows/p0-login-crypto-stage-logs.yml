name: P0 login crypto stage privacy contract
on:
  pull_request:
  push:
    branches: [main]
jobs:
  crypto-stage:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify privacy-safe KDF stage diagnostics
        run: node scripts/test-p0-login-crypto-stage-logs.mjs
