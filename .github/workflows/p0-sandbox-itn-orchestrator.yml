name: P0 composed sandbox ITN gates contract
on:
  pull_request:
  push:
    branches: [main]
jobs:
  orchestrator:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate composed ITN fail-closed security gates
        run: node scripts/test-p0-sandbox-itn-orchestrator.mjs
