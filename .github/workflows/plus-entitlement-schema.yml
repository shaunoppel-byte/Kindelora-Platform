name: PLUS entitlement D1 schema contract
on:
  pull_request:
  push:
    branches: [main]
jobs:
  entitlement:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/test-plus-entitlement-schema.py
