name: Affirmation catalogue integrity
on:
  pull_request:
    paths:
      - 'affirmation-library.js'
      - 'scripts/check-affirmation-catalogue.mjs'
      - '.github/workflows/affirmation-catalogue-integrity.yml'
  push:
    branches: [main]
    paths:
      - 'affirmation-library.js'
      - 'scripts/check-affirmation-catalogue.mjs'
      - '.github/workflows/affirmation-catalogue-integrity.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify 400 unique cards and required fields
        run: node scripts/check-affirmation-catalogue.mjs
