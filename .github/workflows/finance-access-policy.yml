name: Finance access policy QA
on:
  push:
    paths:
      - 'lib/finance/authorization.mjs'
      - 'scripts/test-finance-authorization.mjs'
      - '.github/workflows/finance-access-policy.yml'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  finance-rbac:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/test-finance-authorization.mjs
