name: P0 PayFast sandbox payment decision contract
on:
  pull_request:
  push:
    branches: [main]
jobs:
  sandbox-payment-decision:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reject forged replayed and mismatched ITN decisions
        run: node scripts/test-p0-payfast-sandbox-payment-decision.mjs
