name: PayFast sandbox atomic D1 ledger commit
on:
  pull_request:
  push:
    branches: [main]
jobs:
  atomic:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/test-payfast-sandbox-ledger-commit.mjs
