name: P0 PLUS protected content
on:
  pull_request:
    paths:
      - 'functions/**'
      - 'scripts/test-p0-plus-protected-content.mjs'
      - '.github/workflows/p0-plus-protected-content.yml'
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --experimental-default-type=module scripts/test-p0-plus-protected-content.mjs
