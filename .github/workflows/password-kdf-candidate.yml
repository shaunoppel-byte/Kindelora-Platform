name: Password KDF candidate offline tests
on:
  pull_request:
    paths:
      - 'functions/_lib/member-password-kdf-candidate.js'
      - 'scripts/test-member-password-kdf-candidate.mjs'
      - '.github/workflows/password-kdf-candidate.yml'
jobs:
  candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/test-member-password-kdf-candidate.mjs
