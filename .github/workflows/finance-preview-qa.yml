name: Finance design preview QA
on:
  push:
    paths:
      - 'finance-design-preview.html'
      - 'assets/js/finance-design-preview.js'
      - 'assets/js/finance-reporting-preview.js'
      - 'assets/js/finance-reporting-engine.js'
      - 'assets/js/finance-assistant-engine.js'
      - 'assets/js/finance-assistant-preview.js'
      - 'assets/js/finance-analytics-preview.js'
      - 'functions/_middleware.js'
      - 'scripts/test-finance-preview.mjs'
      - 'scripts/test-simulated-commerce.mjs'
      - 'scripts/fixtures/simulated-commerce.mjs'
      - '.github/workflows/finance-preview-qa.yml'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  finance-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/test-finance-preview.mjs
      - run: node scripts/test-simulated-commerce.mjs
      - run: node scripts/test-finance-assistant.mjs
