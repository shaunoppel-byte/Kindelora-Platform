name: PayFast sandbox verified member DB gate
on:
  pull_request:
  push:
    branches: [main]
jobs:
  member-gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/test-payfast-sandbox-verified-member.mjs
