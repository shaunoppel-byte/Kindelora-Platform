name: PayFast authenticated sandbox checkout
on:
  pull_request:
  push:
    branches: [main]
jobs:
  authenticated-sandbox-checkout:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --experimental-default-type=module scripts/test-payfast-authenticated-sandbox-checkout.mjs
