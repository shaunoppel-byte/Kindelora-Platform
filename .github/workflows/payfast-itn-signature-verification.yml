name: PayFast ITN cryptographic signature verification
on:
  pull_request:
  push:
    branches: [main]
jobs:
  md5-signature:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --experimental-default-type=module scripts/test-payfast-itn-signature-verification.mjs
