name: PayFast sandbox D1 schema contract
on:
  pull_request:
  push:
    branches: [main]
jobs:
  schema:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/test-payfast-sandbox-schema.mjs
