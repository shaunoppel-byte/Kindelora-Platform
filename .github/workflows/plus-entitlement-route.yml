name: PLUS authenticated entitlement status
on:
  pull_request:
  push:
    branches: [main]
jobs:
  status:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/test-plus-entitlement-route.mjs
