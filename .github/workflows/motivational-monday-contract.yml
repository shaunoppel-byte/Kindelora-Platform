name: Motivational Monday static contract
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate Monday static-site contract
        run: python3 scripts/check_motivational_monday.py
      - name: Verify website and PWA private Monday reader contract
        run: node scripts/check-monday-plus-reader-contract.mjs
      - name: Exercise actual protected Monday endpoint against guest and subscriber mocks
        run: node scripts/monday-private-access-smoke.mjs
      - name: Verify NO-GO blocks private R2 publication payload
        run: node scripts/test-monday-private-r2-preparation.mjs
