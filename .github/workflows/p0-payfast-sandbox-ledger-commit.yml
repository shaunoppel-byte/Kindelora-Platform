name: P0 PayFast sandbox D1 ledger batch contract
on:
  pull_request:
  push:
    branches: [main]
jobs:
  ledger-batch:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test sandbox D1 batch execution and fail-closed response
        run: node scripts/test-p0-payfast-sandbox-ledger-commit.mjs
