name: Password KDF Workers runtime compatibility
on:
  pull_request:
    paths:
      - 'functions/_lib/member-password-kdf-candidate.js'
      - 'scripts/worker-password-kdf-probe.mjs'
      - '.github/workflows/password-kdf-workerd.yml'
jobs:
  workerd:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Start local Cloudflare workerd (no deployment)
        run: |
          npx --yes wrangler@4 dev scripts/worker-password-kdf-probe.mjs --local --port 8799 --ip 127.0.0.1 > /tmp/kdf-workerd.log 2>&1 &
          echo $! > /tmp/kdf-workerd.pid
      - name: Verify runtime KDF
        run: |
          set -eu
          for attempt in $(seq 1 30); do
            status=$(curl --silent --output /tmp/kdf-result --write-out '%{http_code}' --max-time 10 http://127.0.0.1:8799/probe || true)
            if [ "$status" = "200" ]; then
              grep -qx 'KDF_RUNTIME_OK' /tmp/kdf-result
              exit 0
            fi
            if [ "$status" = "503" ]; then
              echo "Workers runtime rejected password KDF candidate"
              exit 1
            fi
            sleep 2
          done
          echo "Local workerd did not start"
          exit 1
      - name: Report legacy PBKDF2 compatibility (informational only)
        run: |
          set -eu
          result=$(curl --fail --silent --show-error --max-time 15 http://127.0.0.1:8799/legacy-limit)
          case "$result" in
            LEGACY_310K_SUPPORTED|LEGACY_310K_REJECTED) echo "$result" ;;
            *) echo "Unexpected legacy compatibility result"; exit 1 ;;
          esac
      - name: Stop local workerd
        if: always()
        run: kill "$(cat /tmp/kdf-workerd.pid)" 2>/dev/null || true
