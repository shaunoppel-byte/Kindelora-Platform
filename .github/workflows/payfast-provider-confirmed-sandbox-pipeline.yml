name: PayFast provider-confirmed sandbox pipeline
on:
  pull_request:
  push:
    branches: [main]
jobs:
  provider-confirmation:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/test-payfast-provider-confirmed-sandbox-pipeline.mjs
