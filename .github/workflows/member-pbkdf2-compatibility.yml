name: Member PBKDF2 compatibility contract
on:
  pull_request:
    paths:
      - 'functions/api/member/registration-request.js'
      - 'functions/api/member/register.js'
      - 'functions/api/member/login.js'
      - 'scripts/test-member-pbkdf2-compatibility.mjs'
      - 'scripts/test-member-password-migration.mjs'
      - 'scripts/test-member-v2-auth-parity.mjs'
      - 'scripts/test-member-login-handler-integration.mjs'
      - 'functions/_lib/member-password-recovery.js'
      - 'scripts/test-member-password-recovery-primitives.mjs'
      - 'functions/_lib/member-password-recovery-delivery.js'
      - 'scripts/test-member-password-recovery-delivery.mjs'
      - 'migrations/0005_member_password_recovery.sql'
      - 'scripts/test-member-password-recovery-migration.mjs'
      - 'functions/api/member/request-password-reset.js'
      - 'scripts/test-member-password-recovery-request.mjs'
      - 'functions/api/member/confirm-password-reset.js'
      - 'scripts/test-member-password-recovery-confirm.mjs'
      - 'recover-account.html'
      - 'scripts/test-member-password-recovery-transaction.mjs'
      - 'plus-account.html'
      - 'scripts/test-member-recovery-discovery.mjs'
      - 'scripts/test-member-password-recovery-sqlite.py'
      - 'scripts/test-member-recovery-atomic-throttle.py'
      - 'scripts/check-member-recovery-d1-preflight.py'
      - 'scripts/test-member-recovery-d1-preflight.py'
      - '.github/workflows/member-pbkdf2-compatibility.yml'
  workflow_dispatch:
jobs:
  compatibility:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python3 scripts/test-member-password-recovery-sqlite.py -v
      - run: python3 scripts/test-member-recovery-atomic-throttle.py -v
      - run: python3 scripts/test-member-recovery-d1-preflight.py -v
      - run: node --test scripts/test-member-pbkdf2-compatibility.mjs scripts/test-member-password-migration.mjs scripts/test-member-v2-auth-parity.mjs scripts/test-member-login-handler-integration.mjs scripts/test-member-password-recovery-primitives.mjs scripts/test-member-password-recovery-delivery.mjs scripts/test-member-password-recovery-migration.mjs scripts/test-member-password-recovery-request.mjs scripts/test-member-password-recovery-confirm.mjs scripts/test-member-password-recovery-transaction.mjs scripts/test-member-recovery-discovery.mjs
