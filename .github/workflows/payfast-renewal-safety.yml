name: PayFast renewal safety tests

on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - 'functions/_lib/payfast-live-renewal-*.js'
      - 'functions/_lib/payfast-renewal-isolated-staging-executor.js'
      - 'functions/_lib/payfast-live-authenticated-itn.js'
      - 'functions/_lib/payfast-itn-signature-verification.js'
      - 'functions/_lib/payfast-itn-server-validation.js'
      - 'functions/_lib/payfast-cloudflare-source-allowlist.js'
      - 'scripts/test-payfast-live-authenticated-itn.mjs'
      - 'functions/_lib/payfast-live-persisted-payment-facts.js'
      - 'functions/_lib/plus-live-activation-atomic-plan.js'
      - 'scripts/test-payfast-renewal-*.mjs'
      - 'scripts/test-payfast-live-renewal-*.mjs'
      - 'migrations/0001_plus_persistence.sql'
      - 'migrations/20261123_plus_payfast_recurring_linkage.sql'
      - 'migrations/20261123_plus_payfast_renewal_atomic_guard.sql'
      - '.github/workflows/payfast-renewal-safety.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  renewal-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Parse-check production payment modules and regression scripts
        shell: bash
        run: |
          set -euo pipefail
          for file in functions/_lib/payfast-live-*.js functions/_lib/payfast-renewal-isolated-staging-executor.js functions/_lib/payfast-itn-*.js functions/api/plus/checkout.js scripts/test-payfast-*.mjs; do
            node --check "$file"
          done
      - name: Run read-only renewal regression tests
        env:
          PAYFAST_RENEWAL_SQL_DEBUG: '1'
        run: |
          node scripts/test-payfast-renewal-paid-order-regression.mjs
          node scripts/test-payfast-renewal-atomic-plan-regression.mjs
          node scripts/test-payfast-live-authenticated-itn.mjs
          node scripts/test-payfast-live-renewal-link-preflight.mjs
          node scripts/test-payfast-renewal-atomic-design.mjs
          node scripts/test-payfast-renewal-isolated-staging-executor.mjs
          node --experimental-sqlite scripts/test-payfast-renewal-sqlite-atomicity.mjs
