name: PayFast sandbox atomic order and FX quote
on:
  pull_request:
  push:
    branches: [main]
jobs:
  order-quote:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --experimental-default-type=module scripts/test-payfast-sandbox-order-quote-commit.mjs
