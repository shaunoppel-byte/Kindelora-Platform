name: Cinematic raster artwork acceptance
on:
  pull_request:
    paths:
      - 'quality/cinematic-raster-manifest.json'
      - 'scripts/check-cinematic-raster-assets.py'
      - '.github/workflows/cinematic-raster-artwork.yml'
      - 'assets/affirmations/**'
  push:
    branches: [main]
    paths:
      - 'quality/cinematic-raster-manifest.json'
      - 'scripts/check-cinematic-raster-assets.py'
      - '.github/workflows/cinematic-raster-artwork.yml'
      - 'assets/affirmations/**'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate proposed cinematic raster assets
        run: python3 scripts/check-cinematic-raster-assets.py
