name: Finance invoice numbering contract
on:
  push:
    paths:
      - 'lib/finance/**'
      - 'scripts/test-finance-invoice-number.mjs'
      - '.github/workflows/finance-invoice-number.yml'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  invoice-number:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/test-finance-invoice-number.mjs
