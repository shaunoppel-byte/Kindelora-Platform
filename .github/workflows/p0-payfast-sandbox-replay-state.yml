name: P0 PayFast sandbox replay state contract
on:
  pull_request:
  push:
    branches: [main]
jobs:
  replay-state:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reject duplicate and conflicting payment ITNs
        run: node scripts/test-p0-payfast-sandbox-replay-state.mjs
