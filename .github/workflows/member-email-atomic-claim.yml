name: Member email atomic claim contract
on:
  pull_request:
    paths:
      - 'migrations/0002_member_verified_email.sql'
      - 'migrations/0003_member_verification_consumed_nonce.sql'
      - 'scripts/test-member-email-atomic-claim.py'
      - '.github/workflows/member-email-atomic-claim.yml'
  workflow_dispatch:
jobs:
  atomic-claim:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/test-member-email-atomic-claim.py
