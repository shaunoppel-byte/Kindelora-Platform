name: Member provider cleanup safety
on:
  pull_request:
    paths:
      - 'functions/api/member/registration-request.js'
      - 'scripts/test-member-provider-cleanup.mjs'
      - '.github/workflows/member-provider-cleanup.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test scripts/test-member-provider-cleanup.mjs
