name: P0 PLUS checkout preflight runtime
on:
  pull_request:
  push:
    branches: [main]
jobs:
  preflight:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify preflight fails closed at runtime
        run: node scripts/test-plus-preflight-runtime.mjs
