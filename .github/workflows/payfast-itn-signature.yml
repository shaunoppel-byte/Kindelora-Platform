name: PayFast ITN signature offline
on:
  push:
    branches: [main]
    paths:
      - 'functions/_lib/payfast-itn-signature.js'
      - 'scripts/test-payfast-itn-signature.mjs'
      - '.github/workflows/payfast-itn-signature.yml'
  pull_request:
    paths:
      - 'functions/_lib/payfast-itn-signature.js'
      - 'scripts/test-payfast-itn-signature.mjs'
      - '.github/workflows/payfast-itn-signature.yml'
jobs:
  signature:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test scripts/test-payfast-itn-signature.mjs
