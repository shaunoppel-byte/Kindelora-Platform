name: PLUS checkout release guard
on:
  push:
    paths:
      - 'index.html'
      - 'plus-account.html'
      - 'plus-account.js'
      - 'functions/_lib/payfast-checkout-signing.js'
      - 'functions/_lib/plus-price-gate.js'
      - 'scripts/test-plus-price-gate.mjs'
      - 'functions/_lib/plus-subscription-policy.js'
      - 'scripts/test-plus-subscription-policy.mjs'
      - 'scripts/test-payfast-checkout-signing.mjs'
      - 'scripts/test-plus-account-ui-contract.mjs'
      - 'app.js'
      - 'functions/**'
      - 'docs/PLUS-LAUNCH-EVIDENCE-MATRIX.md'
      - 'scripts/check-plus-checkout-guard.mjs'
      - 'scripts/test-plus-payment-fail-closed.mjs'
      - 'scripts/test-simulated-commerce.mjs'
      - 'scripts/test-registration-payment-journey.mjs'
      - 'scripts/test-member-plus-subject-binding.mjs'
      - 'scripts/test-member-payment-session-cookie.mjs'
      - 'scripts/test-synthetic-registration-payment-activation.mjs'
      - 'scripts/test-plus-d1-schema.mjs'
      - 'scripts/test-plus-d1-sqlite.py'
      - 'scripts/test-plus-d1-entitlements.py'
      - 'scripts/test-plus-server-entitlement.mjs'
      - 'functions/_lib/plus-entitlement.js'
      - 'functions/_lib/plus-auth-jwt.js'
      - 'scripts/test-plus-auth-jwt.mjs'
      - 'functions/_lib/plus-authorization.js'
      - 'scripts/test-plus-authorization.mjs'
      - 'scripts/test-plus-verify-endpoint.mjs'
      - 'migrations/0001_plus_persistence.sql'
      - 'scripts/fixtures/simulated-commerce.mjs'
      - '.github/workflows/plus-checkout-guard.yml'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checkout-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/check-plus-checkout-guard.mjs
      - run: node scripts/test-plus-account-ui-contract.mjs
      - run: node scripts/test-payfast-checkout-signing.mjs
      - run: node scripts/test-plus-price-gate.mjs
      - run: node scripts/test-plus-order-policy.mjs
      - run: node scripts/test-plus-itn-order-match.mjs
      - run: node scripts/test-plus-subscription-policy.mjs
      - run: node scripts/test-plus-payment-fail-closed.mjs
      - run: node scripts/test-simulated-commerce.mjs
      - run: node scripts/test-registration-payment-journey.mjs
      - run: node scripts/test-member-plus-subject-binding.mjs
      - run: node scripts/test-member-payment-session-cookie.mjs
      - run: node scripts/test-synthetic-registration-payment-activation.mjs
      - run: node scripts/test-plus-d1-schema.mjs
      - run: python3 scripts/test-plus-d1-sqlite.py
      - run: python3 scripts/test-plus-d1-entitlements.py
      - run: node scripts/test-plus-server-entitlement.mjs
      - run: node scripts/test-plus-auth-jwt.mjs
      - run: node scripts/test-plus-authorization.mjs
      - run: node scripts/test-plus-verify-endpoint.mjs
