name: P0 PayFast live payment foundation regression
on:
  push:
    branches: [main]
    paths:
      - 'functions/_lib/payfast-live-*.js'
      - 'functions/_lib/plus-*.js'
      - 'scripts/test-payfast-live-*.mjs'
      - 'scripts/test-plus-*.mjs'
      - '.github/workflows/p0-payfast-live-foundation.yml'
  pull_request:
    paths:
      - 'functions/_lib/payfast-live-*.js'
      - 'functions/_lib/plus-*.js'
      - 'scripts/test-payfast-live-*.mjs'
      - 'scripts/test-plus-*.mjs'
      - '.github/workflows/p0-payfast-live-foundation.yml'
jobs:
  live-foundation-regressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run all six production payment foundation tests against the same checkout
        run: node --test scripts/test-payfast-live-redirect.mjs scripts/test-payfast-live-order-preflight.mjs scripts/test-payfast-live-order-persistence.mjs scripts/test-payfast-live-persisted-payment-facts.mjs scripts/test-payfast-live-ledger-plan.mjs scripts/test-plus-entitlement-period-policy.mjs scripts/test-plus-verified-member-customer.mjs scripts/test-plus-live-activation-atomic-plan.mjs scripts/test-payfast-live-authenticated-itn.mjs scripts/test-payfast-live-authenticated-reconciliation.mjs
