name: PLUS checkout no-charge gate
on:
  pull_request:
    paths:
      - 'functions/api/plus/checkout.js'
      - 'scripts/test-plus-checkout-no-charge.mjs'
      - '.github/workflows/plus-checkout-no-charge.yml'
  workflow_dispatch:
jobs:
  no-charge:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test scripts/test-plus-checkout-no-charge.mjs
