name: PLUS dedicated sandbox UI regression
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sandbox-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --experimental-default-type=module --test tests/plus-sandbox-test-ui.test.mjs tests/plus-sandbox-isolation.test.mjs
