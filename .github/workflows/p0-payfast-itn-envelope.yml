name: P0 PayFast ITN envelope contract
on:
  pull_request:
  push:
    branches: [main]
jobs:
  envelope:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reject malformed PayFast notification envelopes
        run: node scripts/test-p0-payfast-itn-envelope.mjs
