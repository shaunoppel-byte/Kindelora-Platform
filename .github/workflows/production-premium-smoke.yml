name: KINDELORA production security smoke
on:
  push:
    branches: [main]
    paths:
      - 'functions/**'
      - 'sw.js'
      - 'motivational-monday.html'
      - 'assets/audio/**'
      - 'scripts/smoke-production-premium.mjs'
      - '.github/workflows/production-premium-smoke.yml'
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * *'
permissions:
  contents: read
jobs:
  production-security:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: node scripts/smoke-production-premium.mjs
