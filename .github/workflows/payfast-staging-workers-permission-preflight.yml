name: PayFast staging Workers permission preflight

on:
  workflow_dispatch:
    inputs:
      confirm_staging_only:
        description: 'Type STAGING_ONLY to check Cloudflare Workers permissions without deploying'
        required: true
        type: string

permissions:
  contents: read

jobs:
  staging-workers-permission:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: payfast-d1-staging
    env:
      CONFIRM_STAGING_ONLY: ${{ inputs.confirm_staging_only }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.KINDELORA_D1_STAGING_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.KINDELORA_D1_STAGING_ACCOUNT_ID }}
      STAGING_DATABASE_ID: ${{ vars.KINDELORA_D1_STAGING_DATABASE_ID }}
      PRODUCTION_DATABASE_ID: ${{ vars.KINDELORA_D1_PRODUCTION_DATABASE_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Check isolated staging identity and Workers API read permission
        run: python3 scripts/preflight-payfast-staging-workers-permission.py
