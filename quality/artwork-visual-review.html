<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>KINDELORA | Artwork visual QA</title>
<style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#f9f2e8;background:#130e1c}
*{box-sizing:border-box}body{margin:0;padding:clamp(18px,4vw,54px)}
header{max-width:850px;margin:0 auto 32px}h1{font-size:clamp(1.5rem,4vw,2.5rem);margin:0 0 12px;color:#edcb87}p{line-height:1.5;color:#d7cbdc}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:26px;max-width:1440px;margin:auto}
article{min-width:0}figure{position:relative;overflow:hidden;aspect-ratio:3/4;margin:0;border-radius:22px;background:#28203a;border:1px solid #b99c66;box-shadow:0 14px 38px #0008}
figure img{width:100%;height:100%;object-fit:cover;display:block}figure::after{content:"";position:absolute;inset:30% 0 0;background:linear-gradient(transparent,#120c1edc 65%,#120c1ef5)}
.overlay{position:absolute;bottom:0;left:0;right:0;padding:26px 20px;z-index:1;text-align:center;text-shadow:0 2px 10px #000a}
.overlay h2{font-size:1.4rem;color:#f1d18b;margin:0 0 12px}.overlay p{font-size:1.02rem;color:white;margin:0}
figcaption{padding:12px 3px;color:#d7cbdc;font-size:.9rem}
@media(max-width:420px){body{padding:14px}.grid{gap:22px}.overlay{padding:20px 16px}}
</style></head><body>
<header><h1>Artwork visual QA — first four candidates</h1><p>Internal visual review only. These original SVG illustrations are not Platinum-approved photographic replacements. Inspect mobile cropping, contrast, affirmation legibility, composition and theme alignment. No live card behavior is changed by this page.</p></header>
<main class="grid">
<article><figure><img src="../assets/affirmations/editorial-renewal.svg" alt="Renewal illustration" loading="lazy"><div class="overlay"><h2>Growth</h2><p>Every new day gives you permission to begin again.</p></div></figure><figcaption>Growth · Renewal · Check safe text zone and crop</figcaption></article>
<article><figure><img src="../assets/affirmations/editorial-resilience.svg" alt="Resilience illustration" loading="lazy"><div class="overlay"><h2>Strength</h2><p>Your strength is not measured by never falling, but by continuing with kindness.</p></div></figure><figcaption>Strength · Resilience · Check long-text readability</figcaption></article>
<article><figure><img src="../assets/affirmations/editorial-stillness.svg" alt="Stillness illustration" loading="lazy"><div class="overlay"><h2>Calm &amp; Peace</h2><p>You are allowed to slow down. Peace can begin with a single breath.</p></div></figure><figcaption>Calm &amp; Peace · Stillness · Check tonal contrast</figcaption></article>
<article><figure><img src="../assets/affirmations/editorial-self-worth.svg" alt="Self-worth illustration" loading="lazy"><div class="overlay"><h2>Self-Love</h2><p>You are worthy of care, tenderness and belonging, exactly as you are.</p></div></figure><figcaption>Self-Love · Self-Worth · Check semantic fit</figcaption></article>
</main></body></html>
