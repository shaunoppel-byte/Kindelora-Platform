<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="t d"><title id="t">I am enough as I am — KINDELORA affirmation artwork</title><desc id="d">Cinematic golden sunrise over a serene mountain lake, with the affirmation in large readable lettering.</desc><defs><linearGradient id="sky" x2="0" y2="1"><stop stop-color="#20152f"/><stop offset=".35" stop-color="#6a456f"/><stop offset=".67" stop-color="#df987c"/><stop offset="1" stop-color="#f7c883"/></linearGradient><linearGradient id="lake" x2="0" y2="1"><stop stop-color="#f3b88b"/><stop offset=".3" stop-color="#75577b"/><stop offset="1" stop-color="#211a3e"/></linearGradient><linearGradient id="shade" x2="1" y2=".1"><stop stop-color="#120d24" stop-opacity=".88"/><stop offset=".58" stop-color="#1c1229" stop-opacity=".45"/><stop offset="1" stop-color="#24162d" stop-opacity=".05"/></linearGradient><radialGradient id="sun"><stop stop-color="#fff9cf"/><stop offset=".22" stop-color="#ffe8a5"/><stop offset="1" stop-color="#ffd69c" stop-opacity="0"/></radialGradient><filter id="blur"><feGaussianBlur stdDeviation="17"/></filter></defs><rect width="1200" height="900" fill="url(#sky)"/><circle cx="917" cy="424" r="250" fill="url(#sun)"/><circle cx="917" cy="424" r="52" fill="#fff3bb"/><path d="M0 535L115 425 225 500 390 340 542 490 700 317 857 478 1022 346 1200 495V660H0Z" fill="#3a2b50"/><path d="M0 588L168 482 292 570 447 425 603 558 788 450 948 570 1100 475 1200 540V660H0Z" fill="#574061"/><path d="M0 630L210 553 389 614 548 536 706 616 892 560 1060 624 1200 582V675H0Z" fill="#8d647b"/><rect y="630" width="1200" height="270" fill="url(#lake)"/><path d="M0 660Q280 647 550 661T1200 658M0 708Q360 693 700 713T1200 703M0 760Q340 747 730 769T1200 756M0 827Q350 812 720 830T1200 817" stroke="#f6c89d" stroke-width="3" opacity=".38" fill="none"/><path d="M895 631L940 631 1080 900H720Z" fill="#f6d3a0" opacity=".18" filter="url(#blur)"/><rect width="1200" height="900" fill="url(#shade)"/><rect x="32" y="32" width="1136" height="836" rx="23" fill="none" stroke="#f0c889" stroke-width="3"/><text x="88" y="116" fill="#f6dba9" font-family="Arial,sans-serif" font-size="27" font-weight="bold" letter-spacing="8">✦ KINDELORA</text><text x="88" y="304" fill="#fff9f1" font-family="Georgia,serif" font-size="91" font-weight="bold">I am enough</text><text x="88" y="407" fill="#ffe1a1" font-family="Georgia,serif" font-size="88" font-style="italic">as I am.</text><text x="88" y="512" fill="#fff8f2" font-family="Georgia,serif" font-size="35">My worth is not measured by how much</text><text x="88" y="562" fill="#fff8f2" font-family="Georgia,serif" font-size="35">I accomplish. I deserve kindness today.</text><path d="M88 753H1112" stroke="#f2ce99" opacity=".65"/><text x="88" y="811" fill="#ffe0aa" font-family="Arial,sans-serif" font-size="22" letter-spacing="5">KINDNESS · SELF-WORTH · YOU</text></svg>