<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" role="img" aria-label="Rest is part of growing KINDELORA original illustrated affirmation card"><defs><linearGradient id="sky" x2="0" y2="1"><stop stop-color="#45304c"/><stop offset="1" stop-color="#dcb9a2"/></linearGradient><linearGradient id="paper" x2="0" y2="1"><stop stop-color="#fffaf3"/><stop offset="1" stop-color="#f5e9db"/></linearGradient></defs><rect width="1200" height="1200" fill="url(#sky)"/><circle cx="790" cy="260" r="130" fill="#fff3ce" opacity=".85"/><path d="M0 770 Q200 640 420 750 T850 710 T1200 750 V1200 H0Z" fill="#45304c" opacity=".65"/><path d="M0 920 Q350 800 650 910 T1200 860 V1200 H0Z" fill="#132c39" opacity=".9"/><rect y="670" width="1200" height="530" fill="url(#paper)"/><rect x="0" y="670" width="1200" height="7" fill="#c29b56"/><text x="84" y="756" font-family="Georgia,serif" font-size="27" letter-spacing="7" fill="#825b33">K I N D E L O R A</text><text x="84" y="836" font-family="Georgia,serif" font-weight="bold" font-size="51" fill="#311c3d">Rest is part of growing</text><text x="84" y="910" font-family="Arial,sans-serif" font-size="34" fill="#372840"><tspan x="84" dy="0">I am allowed to rest without guilt. Quiet</tspan><tspan x="84" dy="52">moments help me return with strength and</tspan><tspan x="84" dy="52">clarity.</tspan></text><text x="84" y="1160" font-family="Arial,sans-serif" font-size="22" letter-spacing="3" fill="#886b7c">KINDNESS  ·  GROWTH  ·  YOU</text></svg>