<rect width="1200" height="840" fill="url(#shade)"/>
<rect x="36" y="36" width="1128" height="768" rx="22" fill="none" stroke="#f4d19b" stroke-opacity=".72" stroke-width="3"/>
<g fill="#fff5e9"><text x="80" y="105" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="700" letter-spacing="8">✦ KINDELORA</text><text x="80" y="240" font-family="Georgia,serif" font-size="70" font-weight="700">I am enough</text><text x="80" y="325" font-family="Georgia,serif" font-size="76" font-style="italic">as I am.</text></g>
<path d="M80 370H480" stroke="#f2cf98" stroke-width="3"/>
<g fill="#fff4e7" font-family="Arial,Helvetica,sans-serif" font-size="29"><text x="80" y="438">My worth is not measured by</text><text x="80" y="482">how much I accomplish.</text><text x="80" y="526">I deserve kindness today.</text></g>
<text x="80" y="752" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" letter-spacing="4" fill="#f7d7a8">KINDNESS · SELF-WORTH · YOU</text>
</svg>