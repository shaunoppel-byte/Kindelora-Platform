<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 840" role="img" aria-labelledby="title desc">
<title id="title">I am enough as I am — KINDELORA affirmation</title><desc id="desc">Warm golden dawn above layered mountains and a reflective lake, with an affirmation in readable ivory type.</desc>
