<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" role="img" aria-label="The light returns KINDELORA original illustrated affirmation card"><defs><linearGradient id="sky" x2="0" y2="1"><stop stop-color="#183454"/><stop offset="1" stop-color="#e69e6a"/></linearGradient><linearGradient id="paper" x2="0" y2="1"><stop stop-color="#fffaf3"/><stop offset="1" stop-color="#f5e9db"/></linearGradient></defs><rect width="1200" height="1200" fill="url(#sky)"/><circle cx="880" cy="260" r="130" fill="#fff0b0" opacity=".85"/><path d="M0 800 Q400 700 800 790 T1200 740 V1200 H0Z" fill="#183454" opacity=".65"/><path d="M0 970 Q280 840 650 960 T1200 900 V1200 H0Z" fill="#132c39" opacity=".9"/><rect y="670" width="1200" height="530" fill="url(#paper)"/><rect x="0" y="670" width="1200" height="7" fill="#c29b56"/><text x="84" y="756" font-family="Georgia,serif" font-size="27" letter-spacing="7" fill="#825b33">K I N D E L O R A</text><text x="84" y="836" font-family="Georgia,serif" font-weight="bold" font-size="51" fill="#311c3d">The light returns</text><text x="84" y="910" font-family="Arial,sans-serif" font-size="34" fill="#372840"><tspan x="84" dy="0">Even when today feels heavy, I can trust</tspan><tspan x="84" dy="52">that brighter moments are still possible.</tspan></text><text x="84" y="1160" font-family="Arial,sans-serif" font-size="22" letter-spacing="3" fill="#886b7c">KINDNESS  ·  GROWTH  ·  YOU</text></svg>