<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 2000" width="1600" height="2000" role="img" aria-label="Worthy, just as I am affirmation art"><defs><linearGradient id="sky" x2="0" y2="1"><stop stop-color="#4a2e50"/><stop offset="1" stop-color="#c98c99"/></linearGradient><radialGradient id="glow"><stop stop-color="#fbe4b7" stop-opacity=".85"/><stop offset="1" stop-color="#fbe4b7" stop-opacity="0"/></radialGradient></defs><rect width="1600" height="2000" fill="url(#sky)"/><circle cx="800" cy="720" r="560" fill="url(#glow)"/><circle cx="800" cy="720" r="160" fill="#fbe4b7" opacity=".85"/><g fill="#f6d9c6" opacity=".55"><circle cx="245" cy="810" r="55"/><circle cx="325" cy="760" r="48"/><circle cx="410" cy="835" r="65"/><circle cx="1300" cy="850" r="70"/><circle cx="1410" cy="790" r="50"/></g><rect x="105" y="105" width="1390" height="1790" rx="32" fill="none" stroke="#ffe5cf" stroke-opacity=".75" stroke-width="4"/><rect x="155" y="950" width="1290" height="540" rx="35" fill="#19243c" opacity=".64"/><text x="800" y="260" text-anchor="middle" fill="#ffe4b8" font-family="Georgia,serif" font-size="52" letter-spacing="12">KINDELORA</text><text x="800" y="1100" text-anchor="middle" fill="#fff9f3" font-family="Georgia,serif" font-size="72" font-weight="400">I am worthy of kindness</text><text x="800" y="1200" text-anchor="middle" fill="#fff9f3" font-family="Georgia,serif" font-size="72" font-weight="400">even on the days</text><text x="800" y="1300" text-anchor="middle" fill="#fff9f3" font-family="Georgia,serif" font-size="72" font-weight="400">I feel unfinished.</text><text x="800" y="1400" text-anchor="middle" fill="#fff9f3" font-family="Georgia,serif" font-size="72" font-weight="400">I do not have to earn it.</text><text x="800" y="1700" text-anchor="middle" fill="#fff1df" font-family="Georgia,serif" font-size="37">A little kindness can change a day.</text><text x="800" y="1790" text-anchor="middle" fill="#fff1df" font-family="Arial,sans-serif" font-size="26">A FREE MOMENT OF ENCOURAGEMENT</text></svg>