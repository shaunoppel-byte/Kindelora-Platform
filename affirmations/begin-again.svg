<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 2000" width="1600" height="2000" role="img" aria-label="Tomorrow holds possibility affirmation art"><defs><linearGradient id="sky" x2="0" y2="1"><stop stop-color="#273c4c"/><stop offset="1" stop-color="#f1b78d"/></linearGradient><radialGradient id="glow"><stop stop-color="#fff2c6" stop-opacity=".85"/><stop offset="1" stop-color="#fff2c6" stop-opacity="0"/></radialGradient></defs><rect width="1600" height="2000" fill="url(#sky)"/><circle cx="800" cy="720" r="560" fill="url(#glow)"/><circle cx="800" cy="720" r="160" fill="#fff2c6" opacity=".85"/><path d="M0 1120L250 840 490 1020 810 710 1160 1080 1400 860 1600 1020V2000H0Z" fill="#26354d" opacity=".5"/><path d="M0 1330L320 1100 620 1270 960 960 1330 1230 1600 1110V2000H0Z" fill="#142a3b" opacity=".72"/><rect x="105" y="105" width="1390" height="1790" rx="32" fill="none" stroke="#ffe5cf" stroke-opacity=".75" stroke-width="4"/><rect x="155" y="950" width="1290" height="540" rx="35" fill="#19243c" opacity=".64"/><text x="800" y="260" text-anchor="middle" fill="#ffe4b8" font-family="Georgia,serif" font-size="52" letter-spacing="12">KINDELORA</text><text x="800" y="1100" text-anchor="middle" fill="#fff9f3" font-family="Georgia,serif" font-size="72" font-weight="400">A hard day is not</text><text x="800" y="1200" text-anchor="middle" fill="#fff9f3" font-family="Georgia,serif" font-size="72" font-weight="400">the whole story.</text><text x="800" y="1300" text-anchor="middle" fill="#fff9f3" font-family="Georgia,serif" font-size="72" font-weight="400">There is still room</text><text x="800" y="1400" text-anchor="middle" fill="#fff9f3" font-family="Georgia,serif" font-size="72" font-weight="400">for something beautiful.</text><text x="800" y="1700" text-anchor="middle" fill="#fff1df" font-family="Georgia,serif" font-size="37">A little kindness can change a day.</text><text x="800" y="1790" text-anchor="middle" fill="#fff1df" font-family="Arial,sans-serif" font-size="26">A FREE MOMENT OF ENCOURAGEMENT</text></svg>